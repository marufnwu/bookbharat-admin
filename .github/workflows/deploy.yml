name: Deploy React Admin

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: 'Type "v2" to confirm deploy from the correct branch'
        required: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Cache npm and build output for faster rebuilds
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ADMIN_API_URL: ${{ secrets.REACT_APP_ADMIN_API_URL }}
          CI: false
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-admin-build
          path: build/
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudways
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/v2') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_branch == 'v2')
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: react-admin-build
          path: build/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.CLOUDWAYS_SSH_PORT }} ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Cloudways
        run: |
          rsync -rltz --delete \
            --no-progress \
            --omit-dir-times \
            --no-perms \
            -e "ssh -p ${{ secrets.CLOUDWAYS_SSH_PORT }} -i ~/.ssh/deploy_key" \
            build/ ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

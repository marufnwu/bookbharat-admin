name: Deploy React Admin

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint and Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ADMIN_API_URL: ${{ secrets.REACT_APP_API_URL }}/admin
        run: npm run build

  deploy:
    name: Deploy to Cloudways
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ADMIN_API_URL: ${{ secrets.REACT_APP_API_URL }}/admin
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CLOUDWAYS_SSH_PORT }} ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Cloudways
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.CLOUDWAYS_SSH_PORT }}" \
            build/ ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/public_html/

      - name: Health check
        run: |
          sleep 5
          curl -f ${{ secrets.CLOUDWAYS_DOMAIN }} || echo "Health check failed, but deployment completed"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa